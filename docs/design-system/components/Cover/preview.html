<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ram Farid</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--bg); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; height:320px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:320px; overflow:hidden; }
  .art svg { display:block; width:480px; height:320px; overflow:hidden; }
  .brand { fill:var(--primary); }
  .brand-ink { fill:var(--primary-ink); }
  .tint { fill:var(--primary-soft); }
  .deep { fill:var(--ink); }
  .sig { fill:var(--success); }
  .blk { rx:var(--radius-lg); }
  .chip { rx:var(--radius-sm); }
  .dot { fill:var(--primary); }
  .dot.cut { fill:var(--bg); }
  .words { position:absolute; left:var(--space-6); bottom:var(--space-6); max-width:440px; }
  .name { margin:0; font-size:112px; line-height:.92; font-weight:600; letter-spacing:-.035em; color:var(--ink); }
  .tag { margin:var(--space-3) 0 0 4px; font-size:14px; line-height:20px; color:var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 320" width="480" height="320">
<!--
  blocks      primary 160x268 slab bled off the top (the one brand hue, largest) · primary-ink 128x80 · ink 128x128 (deep contrast block, flips light/dark with the theme) · primary-soft 160x224 bleeding off the right edge (relief tint) · success 48x16 chip once (it only ever means "available") — about a third of 960x320
  arrangement one tall violet slab with satellites, bottoms on one line at y=256, space-4 gutters; the tint bleeds right
  pattern     dot grid — the README's "technical and precise, 4px grid" and its .rf-grid-bg pattern: 2px dots at a space-6 pitch in primary over the tint, eight cut out of the slab in bg
  scales      sides in space-4/space-6 multiples; gutters space-4; pitch space-6; corners radius-lg (blocks), radius-sm (chip)
-->
